# PostgreSQL 调优 —— 面向 Oracle AMD 免费层（1/8 OCPU + 1 GB 内存）
#
# 目标：常驻内存压到 60 MB 以内
#
# ⚠️ 核心认知：主要杠杆不是 shared_buffers，而是【连接数】。
#    shared_buffers 是所有连接共享一份；
#    work_mem 是【每连接每操作】私有 —— 20 个连接 × 22MB = 440MB，那才是大头。
#    所以本文件同时压 max_connections，并且必须在 Miniflux 侧
#    设 DATABASE_MAX_CONNS=5（默认 20，不改的话这里调了也白调）。
#
# 放置：/etc/postgresql/<版本>/main/conf.d/99-miniflux-tune.conf
#      （Debian/Ubuntu 的 conf.d 会在 postgresql.conf 末尾自动 include）
# 应用：systemctl restart postgresql

# ---------- 内存 ----------
shared_buffers = 16MB              # 默认 128MB。剩下交给 OS page cache（按需占用、可回收）
work_mem = 1MB                     # 默认 4MB。⚠️ 不要低于 1MB，否则排序全走磁盘
maintenance_work_mem = 8MB         # 默认 64MB。VACUUM / CREATE INDEX 时分配，跑完释放
temp_buffers = 1MB                 # 默认 8MB

# ---------- 连接（真正的杠杆）----------
max_connections = 10               # 默认 100。给 Miniflux 5 条 + 余量

# ---------- 关闭并行（单核上并行只增加调度开销，无收益）----------
max_worker_processes = 2
max_parallel_workers = 0
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 0

# ---------- 大页与缓存估算 ----------
huge_pages = off
effective_cache_size = 128MB       # 仅给 planner 的估值，不实际占用内存

# ---------- WAL（小盘上别贪）----------
wal_buffers = 1MB                  # 默认 -1（自动约 4MB）
min_wal_size = 48MB
max_wal_size = 128MB               # 默认 1GB

# ---------- 后台写入器：低配机器上放慢，减少 CPU 占用 ----------
bgwriter_delay = 200ms             # 默认 200ms
bgwriter_lru_maxpages = 50         # 默认 100

# ---------- 日志：别刷爆磁盘 ----------
log_min_duration_statement = -1
log_min_messages = warning

# ---------- 崩溃安全 vs 速度 ----------
# ⚠️ 保持默认的 fsync=on。免费层磁盘不保证持久性，关了会丢数据。
#    内存不够就调前面的项，不要从这里省。
