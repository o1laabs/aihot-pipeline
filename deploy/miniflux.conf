# /etc/miniflux.conf —— Miniflux 环境变量（systemd 通过 EnvironmentFile 读取）
#
# ⚠️ deb 自带的本文件内容只有一个 RUN_MIGRATIONS=1，其余全部要自己加。
# ⚠️ 改完必须：systemctl restart miniflux
#
# 面向 Oracle AMD 免费层（1 GB 内存）的配置。

# ---------- 数据库 ----------
# ⚠️ 把 PASSWORD 换成你自己的强密码，并同步改 10-postgres.sh 里的
DATABASE_URL=postgres://miniflux:CHANGE_ME_PASSWORD@127.0.0.1/miniflux?sslmode=disable
RUN_MIGRATIONS=1

# ---------- ⚠️ 内存关键项 ----------
# 默认 20。不改的话 PostgreSQL 侧调优全部白费（20 连接 × 22MB = 440MB）
DATABASE_MAX_CONNS=5
DATABASE_MIN_CONNS=1
# 默认 16。feed 解析并发 worker 数，1 核机器上降到 2
WORKER_POOL_SIZE=2
# 默认 100。每批处理的 feed 数
BATCH_SIZE=10

# ---------- 抓取节奏（低配机器别太勤）----------
POLLING_FREQUENCY=120              # 默认 60 分钟
POLLING_SCHEDULER=entry_frequency  # 按源更新频率动态调整，比 round_robin 聪明
POLLING_LIMIT_PER_HOST=2           # 默认 0（不限）。限同域名并发，别打爆对方
HTTP_CLIENT_TIMEOUT=20

# ---------- 监听 ----------
# 只监听本机，对外由 Caddy 反代（这样 TLS 由 Caddy 管）
LISTEN_ADDR=127.0.0.1:8080
# ⚠️ 改成你的实际域名，否则生成的链接和 cookie 都是错的
BASE_URL=https://miniflux.example.com

# ---------- 首次启动创建管理员 ----------
# ⚠️ 只在库为空时生效。建完可以删掉这两行（或改密码用 miniflux CLI）
CREATE_ADMIN=1
ADMIN_USERNAME=admin
ADMIN_PASSWORD=CHANGE_ME_ADMIN_PASSWORD

# ---------- 清理（1 GB 机器上别留太多历史）----------
CLEANUP_ARCHIVE_READ_DAYS=60
CLEANUP_ARCHIVE_UNREAD_DAYS=180
CLEANUP_FREQUENCY_HOURS=24
